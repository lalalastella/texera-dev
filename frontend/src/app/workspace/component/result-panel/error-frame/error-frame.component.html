<div
  *ngIf="operatorId === undefined"
  class="all-errors-notification">
  Showing errors for all operators:
</div>
<div *ngIf="categoryToErrorMapping.size === 0">
  <div style="text-align: center">
    <h4>No error to display.</h4>
  </div>
</div>

<div *ngFor="let category of categoryToErrorMapping | keyvalue">
  <div class="error-category">{{category.key}}:</div>
  <nz-collapse *ngIf="category.value.length > 0">
    <nz-collapse-panel
      *ngFor="let error of category.value"
      [nzHeader]="error.message"
      [nzActive]="false"
      [nzDisabled]="false"
      [nzExtra]="extraTpl">
      <ng-template #extraTpl>
        <span
          class="goto-operator-icon"
          *ngIf="error.operatorId !== 'unknown operator' && operatorId !== error.operatorId"
          nz-icon
          nzType="aim"
          title="focus operator"
          (click)="$event.stopPropagation(); onClickGotoButton(error.operatorId)"></span>
      </ng-template>
      <p class="error-message">{{ error.details }}</p>

      <!-- Fix with AI section -->
      <div
        *ngIf="error.operatorId && error.operatorId !== 'unknown operator'"
        class="fix-ai-section">
        <button
          nz-button
          nzSize="small"
          nzType="primary"
          *ngIf="!getFixState(error)"
          (click)="fixWithAI(error)">
          <i
            nz-icon
            nzType="tool"
            nzTheme="outline"></i>
          Fix with AI
        </button>

        <nz-spin
          *ngIf="getFixState(error)?.loading"
          nzSimple
          nzSize="small"></nz-spin>

        <div *ngIf="getFixState(error) as state">
          <nz-alert
            *ngIf="state.error"
            nzType="error"
            [nzMessage]="state.error"></nz-alert>

          <div
            *ngIf="state.result"
            class="fix-result">
            <p class="fix-explanation">{{ state.result.explanation }}</p>
            <div *ngIf="state.result.fix">
              <p class="fix-label">Suggested config changes:</p>
              <pre class="fix-diff">{{ state.result.fix | json }}</pre>
              <button
                nz-button
                nzSize="small"
                nzType="primary"
                (click)="applyFix(error)">
                Apply Fix
              </button>
            </div>
          </div>
        </div>
      </div>
    </nz-collapse-panel>
  </nz-collapse>
</div>
